[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kbo-statistics-crawler"
version = "0.1.0"
description = "Reproducible KBO game, player, roster, and pitch data crawler"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "requests>=2.32",
    "tenacity>=9.0",
]

[project.optional-dependencies]
browser = [
    "selenium>=4.20",
    "webdriver-manager>=4.0",
]
dev = [
    "pytest>=8.0",
]
simulation = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "numpy>=2.0",
]

[project.scripts]
kbo-crawl = "kbo_crawler.cli:main"
kbo-crawl-period = "kbo_crawler.period_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
